<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiri · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --cream:#f9e9d2;
    --cream-soft:#fdf3e6;
    --dark:#282828;
    --dark-soft:#3a3a3a;
    --green:#18482d;
    --green-deep:#103420;
    --green-mid:#456854;
    --green-light:#7b947a;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--cream);
    font-family:'Montserrat',sans-serif;
    color:var(--dark);
    padding:40px 20px;
  }

  .card{
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo{
    width:190px;
    height:auto;
    margin-bottom:2px;
  }

  .tagline{
    font-family:'Caveat',cursive;
    font-weight:600;
    font-size:1.55rem;
    color:var(--green-mid);
    text-align:center;
    margin-bottom:34px;
    letter-spacing:.01em;
  }

  form{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .field label{
    position:absolute;
    width:1px; height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
  }

  .field-wrap{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--dark);
    border-radius:8px;
    height:52px;
    padding:0 16px;
    border:1.5px solid transparent;
    transition:border-color .2s ease, transform .12s ease;
  }

  .field-wrap:focus-within{
    border-color:var(--green-mid);
  }

  .field-wrap i.field-icon{
    color:var(--cream);
    font-size:.95rem;
    width:16px;
    text-align:center;
    flex-shrink:0;
  }

  .field-wrap input{
    flex:1;
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:#ffffff;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:.74rem;
    letter-spacing:.12em;
    text-transform:uppercase;
  }

  .field-wrap input::placeholder{
    color:#d9d4cb;
    opacity:.65;
  }

  .toggle-pass{
    background:none;
    border:none;
    color:var(--cream);
    opacity:.75;
    font-size:.9rem;
    cursor:pointer;
    padding:6px;
    flex-shrink:0;
    transition:opacity .15s ease;
  }
  .toggle-pass:hover{ opacity:1; }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 2px 0;
    font-size:.7rem;
    letter-spacing:.04em;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    color:var(--green-mid);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:.65rem;
  }

  .remember input{
    appearance:none;
    width:15px; height:15px;
    border:1.5px solid var(--green-mid);
    border-radius:3px;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
    background:var(--cream-soft);
  }
  .remember input:checked{
    background:var(--green);
    border-color:var(--green);
  }
  .remember input:checked::after{
    content:'';
    position:absolute;
    left:4px; top:1px;
    width:4px; height:8px;
    border:solid var(--cream);
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  .forgot{
    color:var(--green-mid);
    text-decoration:none;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:.65rem;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  .forgot:hover{
    color:var(--green);
    border-color:var(--green-mid);
  }

  .btn-primary{
    margin-top:10px;
    height:54px;
    border:none;
    border-radius:10px;
    background:var(--green);
    color:var(--cream-soft);
    font-family:'Montserrat',sans-serif;
    font-weight:800;
    font-size:.95rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .2s ease, transform .12s ease, box-shadow .2s ease;
  }
  .btn-primary:hover{
    background:var(--green-deep);
    transform:translateY(-1px);
    box-shadow:0 6px 16px -8px rgba(16,52,32,.6);
  }
  .btn-primary:active{ transform:translateY(0); }

  .divider{
    position:relative;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:32px 0 22px;
  }
  .divider::before{
    content:'';
    position:absolute;
    left:0; right:0; top:50%;
    height:1px;
    background:var(--green-light);
    opacity:.35;
  }
  .divider span{
    position:relative;
    background:var(--cream);
    padding:0 16px;
    font-family:'Caveat',cursive;
    font-weight:600;
    font-size:1.25rem;
    color:var(--green-mid);
  }
  .divider .bird{
    position:absolute;
    left:calc(50% + 34px);
    bottom:1px;
    width:30px;
    height:24px;
    color:var(--green-mid);
  }

  .socials{
    display:flex;
    gap:18px;
    justify-content:center;
    margin-bottom:30px;
  }
  .social-btn{
    width:48px; height:48px;
    border-radius:50%;
    border:none;
    background:var(--dark);
    color:var(--cream-soft);
    font-size:1.15rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .2s ease, transform .12s ease;
  }
  .social-btn:hover{
    background:var(--green);
    transform:translateY(-2px);
  }

  .signup-link{
    text-align:center;
    font-size:.78rem;
    color:var(--green-mid);
    letter-spacing:.02em;
  }
  .signup-link a{
    color:var(--green);
    font-weight:800;
    text-decoration:none;
    border-bottom:1.5px solid var(--green-light);
    transition:border-color .15s ease;
  }
  .signup-link a:hover{
    border-color:var(--green);
  }

  @media (prefers-reduced-motion: reduce){
    .btn-primary, .social-btn{ transition:none; }
  }

  @media (max-width:340px){
    .logo{ width:160px; }
    .tagline{ font-size:1.35rem; }
  }

  :focus-visible{
    outline:2px solid var(--green-mid);
    outline-offset:2px;
  }
</style>
</head>

    <p class="tagline">Sua alimentação mais fácil e saudável!</p>

    <form action="#" method="post" autocomplete="on">
      <div class="field">
        <label for="login">E-mail ou usuário</label>
        <div class="field-wrap">
          <i class="field-icon fa-solid fa-envelope" aria-hidden="true"></i>
          <input id="login" name="login" type="text" placeholder="E-MAIL OU USERNAME" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="field-wrap">
          <i class="field-icon fa-solid fa-lock" aria-hidden="true"></i>
          <input id="password" name="password" type="password" placeholder="PASSWORD" autocomplete="current-password" required>
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar senha" aria-pressed="false">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" name="remember">
          Lembrar de mim
        </label>
        <a class="forgot" href="#">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <div class="divider">
      <svg class="bird" viewBox="0 0 60 46" fill="currentColor" aria-hidden="true">
        <path d="M3 40 C3 30 12 25 22 24 C24 16 33 11 42 13 C39 16 40 20 43 21 C52 19 58 24 57 29 C52 27 47 28 44 31 C49 33 49 38 45 41 C40 35 32 33 25 35 C17 37 10 40 6 43 C4 42 3 41 3 40 Z"/>
        <circle cx="33" cy="17" r="1.6" fill="var(--cream)"/>
      </svg>
      <span>ou</span>
    </div>

    <div class="socials">
      <button class="social-btn" type="button" aria-label="Entrar com Facebook">
        <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
      </button>
      <button class="social-btn" type="button" aria-label="Entrar com Google">
        <i class="fa-brands fa-google" aria-hidden="true"></i>
      </button>
    </div>

    <p class="signup-link">Não tem conta? <a href="#">Cadastre-se</a></p>
  </main>

  <script>
    const toggle = document.getElementById('togglePass');
    const passInput = document.getElementById('password');
    toggle.addEventListener('click', () => {
      const isHidden = passInput.type === 'password';
      passInput.type = isHidden ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', String(isHidden));
      toggle.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
      toggle.innerHTML = isHidden
        ? '<i class="fa-solid fa-eye-slash" aria-hidden="true"></i>'
        : '<i class="fa-solid fa-eye" aria-hidden="true"></i>';
    });
  </script>
</body>
</html>
