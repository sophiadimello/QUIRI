<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiri — Criar conta</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
 
<div class="app">
  <div class="toast" id="toast"></div>
 
  <div class="auth-hero">
    <svg width="44" height="44" viewBox="0 0 60 60" fill="none">
      <rect x="10" y="22" width="3" height="18" rx="1.5" fill="#F5EFE0"/>
      <rect x="16" y="18" width="3" height="22" rx="1.5" fill="#F5EFE0"/>
      <rect x="22" y="20" width="3" height="20" rx="1.5" fill="#F5EFE0"/>
      <rect x="28" y="18" width="3" height="22" rx="1.5" fill="#F5EFE0"/>
      <rect x="34" y="22" width="3" height="18" rx="1.5" fill="#F5EFE0"/>
      <circle cx="42" cy="28" r="10" stroke="#F5EFE0" stroke-width="3" fill="none"/>
      <line x1="49" y1="35" x2="55" y2="41" stroke="#F5EFE0" stroke-width="3" stroke-linecap="round"/>
      <circle cx="38" cy="16" r="4" fill="#F5EFE0"/>
    </svg>
    <div class="auth-hero-title">Quiri</div>
    <div class="auth-hero-sub">Cadastro de nutricionista</div>
  </div>
 
  <div class="auth-body">
    <h2>Criar conta</h2>
 
    <div class="field-label">Nome completo</div>
    <input class="field-input" type="text" id="cad-nome" placeholder="Dra. Ana Souza">
 
    <div class="field-label">CRN (Conselho Regional)</div>
    <input class="field-input" type="text" id="cad-crn" placeholder="CRN-1 00000">
 
    <div class="field-label">Especialidade</div>
    <select class="field-input" id="cad-esp">
      <option value="">Selecione...</option>
      <option>Nutrição clínica</option>
      <option>Nutrição esportiva</option>
      <option>Nutrição funcional</option>
      <option>Nutrição pediátrica</option>
    </select>
 
    <div class="field-label">E-mail profissional</div>
    <input class="field-input" type="email" id="cad-email" placeholder="ana@clinica.com.br">
 
    <div class="field-label">Telefone</div>
    <input class="field-input" type="tel" id="cad-tel" placeholder="(61) 99999-0000">
 
    <div class="field-label">Senha</div>
    <input class="field-input" type="password" id="cad-senha" placeholder="Mínimo 8 caracteres" oninput="checkPwStrength(this.value)">
    <div style="background:#e0ede6;border-radius:2px;margin-top:6px;height:4px;">
      <div id="pw-bar" style="height:4px;border-radius:2px;width:0;transition:width 0.3s,background 0.3s;"></div>
    </div>
 
    <div class="field-label">Confirmar senha</div>
    <input class="field-input" type="password" id="cad-senha2" placeholder="Repita a senha">
    <div class="error-msg" id="err-senha2">As senhas não coincidem.</div>
 
    <button class="btn-green" onclick="efetuarCadastro()">Criar conta</button>
    <div class="auth-link">Já tem conta? <a href="login.html">Entrar</a></div>
    <div style="height:24px;"></div>
  </div>
</div>
 
<script>
function showToast(msg, color) {
  var t = document.getElementById('toast');
  t.style.background = color || '#2D6A4F';
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}
 
function checkPwStrength(v) {
  var bar = document.getElementById('pw-bar');
  var len = v.length;
  var pct = Math.min(len / 12 * 100, 100);
  var color = len < 6 ? '#c0625a' : len < 10 ? '#d4b27a' : '#2D6A4F';
  bar.style.width = pct + '%';
  bar.style.background = color;
}
 
function efetuarCadastro() {
  var nome = document.getElementById('cad-nome').value.trim();
  var crn = document.getElementById('cad-crn').value.trim();
  var email = document.getElementById('cad-email').value.trim();
  var s1 = document.getElementById('cad-senha').value;
  var s2 = document.getElementById('cad-senha2').value;
  var err = document.getElementById('err-senha2');
  if (!nome || !crn || !email) { showToast('⚠ Preencha todos os campos obrigatórios.','#c0625a'); return; }
  if (s1 !== s2) { err.classList.add('show'); document.getElementById('cad-senha2').classList.add('error'); return; }
  err.classList.remove('show');
  window.location.href = 'auth-pendente.html?email=' + encodeURIComponent(email);
}
</script>
 
</body>
</html>
